<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
</head>
<body>

    <h1>Product Details</h1>

    <div>

        <h2>Laptop</h2>

        <p>Price: ₹55,000</p>

        <h3>Features</h3>

        <ul>
            <li>16GB RAM</li>
            <li>512GB SSD</li>
            <li>Intel Processor</li>
            <li>15.6-inch Display</li>
        </ul>

    </div>

    <h2>Product Specifications</h2>

    <table border="1">
        <tr>
            <th>Specification</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>RAM</td>
            <td>16GB</td>
        </tr>

        <tr>
            <td>Storage</td>
            <td>512GB SSD</td>
        </tr>

        <tr>
            <td>Processor</td>
            <td>Intel Processor</td>
        </tr>

        <tr>
            <td>Display</td>
            <td>15.6-inch</td>
        </tr>

        <tr>
            <td>Price</td>
            <td>₹55,000</td>
        </tr>
    </table>

    <h2>Order Form</h2>

    <form>

        <label>Customer Name:</label>
        <input type="text" name="customer_name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <label>Phone:</label>
        <input type="tel" name="phone">
        <br><br>

        <label>Quantity:</label>
        <input type="number" name="quantity" min="1">
        <br><br>

        <label>Address:</label>
        <br>
        <textarea name="address" rows="5" cols="30"></textarea>
        <br><br>

        <button type="submit">Order</button>

    </form>

</body>
</html>
